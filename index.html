<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Mapa Interactivo — Prepa 2 UAEH</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Nunito:wght@400;600;700;800&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="style.css" />
</head>
<body>

<!-- ============================================================
     HEADER
     ============================================================ -->
<header class="header">
    <div class="header-logo">
        <div class="header-logo-img"></div>
        <div class="header-logo-sep"></div>
        <span class="header-logo-text">Prepa <em>2</em> · UAEH</span>
    </div>

    <div class="header-right">
        <span class="mode-chip" id="js-mode-label">Explorar mapa</span>
        <button class="header-reset-btn" id="js-reset-btn">✕ Limpiar ruta</button>
        <div class="header-user" id="js-logout-btn">
            <div class="user-dot"></div>
            <span id="js-username-display">—</span>
        </div>
    </div>
</header>

<!-- ============================================================
     LAYOUT PRINCIPAL
     ============================================================ -->
<main class="main">

    <!-- SIDEBAR -->
    <aside class="cinta">

        <!-- Lista de POIs -->
        <p class="section-label">Lugares</p>
        <ul class="poi-list" id="js-poi-list"></ul>

        <div class="divider"></div>

        <!-- Panel de ruta -->
        <p class="section-label">Mi ruta</p>
        <p class="route-hint" id="js-route-hint">
            Haz clic en el mapa para marcar el <strong>origen</strong>.
        </p>

        <div class="route-points">
            <div class="route-point">
                <div class="rp-dot rp-dot--origin"></div>
                <span class="rp-label" id="js-origin-label">Sin seleccionar</span>
            </div>
            <div class="rp-connector" style="margin-left:4px"></div>
            <div class="route-point">
                <div class="rp-dot rp-dot--dest"></div>
                <span class="rp-label" id="js-dest-label">Sin seleccionar</span>
            </div>
        </div>

        <button class="clear-btn" id="js-clear-route-btn">🗑 Limpiar ruta</button>

        <div class="divider"></div>

        <!-- Leyenda -->
        <p class="section-label">Leyenda</p>
        <div class="legend-item"><div class="legend-dot legend-dot--building"></div>Edificio / Aula</div>
        <div class="legend-item"><div class="legend-dot legend-dot--sport"></div>Área deportiva</div>
        <div class="legend-item"><div class="legend-dot legend-dot--parking"></div>Estacionamiento</div>
        <div class="legend-item"><div class="legend-dot legend-dot--service"></div>Servicio</div>

    </aside>

    <!-- MAPA -->
    <div class="map-container">
        <div class="map-wrapper" id="js-map-wrapper">

            <canvas id="js-map-canvas"></canvas>

            <!-- Tooltip -->
            <div class="map-tooltip" id="js-tooltip">
                <img class="tooltip-img" id="js-tooltip-img" src="" alt="" />
                <div class="tooltip-body">
                    <span class="tooltip-icon" id="js-tooltip-icon"></span>
                    <span class="tooltip-name" id="js-tooltip-name"></span>
                    <span class="tooltip-desc" id="js-tooltip-desc"></span>
                </div>
            </div>

            <!-- Controles de zoom -->
            <div class="zoom-controls">
                <button class="zoom-btn" id="js-zoom-in"    title="Acercar">+</button>
                <button class="zoom-btn" id="js-zoom-out"   title="Alejar">−</button>
                <button class="zoom-btn" id="js-zoom-reset" title="Centrar" style="font-size:13px">⊙</button>
            </div>

            <!-- Instrucciones pie de mapa -->
            <div class="map-tip">Arrastra · Scroll para zoom · Click para trazar ruta</div>

            <!-- Coordenadas en tiempo real -->
            <div class="map-coords" id="js-coords">x: —  y: —</div>

        </div>
    </div>

</main>

<script src="map.js"></script>
</body>
</html>
